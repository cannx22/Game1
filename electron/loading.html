<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:">
  <title>Civciv Kıyameti</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
  <style>
    body { margin: 0; min-height: 100vh; font-family: 'Baloo 2', 'Segoe UI', sans-serif; color: #3b2a1a;
      background: linear-gradient(#9ad7ff 0 55%, #86c95f 55%); display: flex; align-items: center; justify-content: center; }
    .card { background: #fffdf6; border: 4px solid #f1dfbf; border-radius: 24px; padding: 28px 36px; text-align: center; min-width: 380px;
      box-shadow: 0 6px 0 rgba(90,55,20,.25), 0 12px 28px rgba(0,0,0,.18); }
    img { width: 110px; height: 110px; animation: wobble 2.4s ease-in-out infinite; }
    @keyframes wobble { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-4px); } }
    h1 { margin: 6px 0 0; font-size: 26px; }
    p { color: #8a7560; margin: 6px 0 16px; }
    button { border: none; border-radius: 14px; padding: 10px 22px; background: #ffd23f; box-shadow: 0 4px 0 #d4a20f; cursor: pointer; font: inherit; font-weight: 700; font-size: 18px; }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d4a20f; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="">
    <h1 id="title">Çiftliğe bağlanılıyor…</h1>
    <p id="text">Lütfen bekle.</p>
    <button id="retry" class="hidden">🔄 Tekrar dene</button>
  </div>
  <script src="loading.js"></script>
</body>
</html>
